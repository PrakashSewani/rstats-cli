[package]
name = "rstats"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Cross-platform terminal system resource monitor"
license = "MIT"
repository = "https://github.com/PrakashSewani/rstats-cli"
homepage = "https://github.com/PrakashSewani/rstats-cli"
readme = "README.md"
keywords = ["system-monitor", "terminal", "tui", "rust", "metrics"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.27"
directories = "5"
ratatui = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.29"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
