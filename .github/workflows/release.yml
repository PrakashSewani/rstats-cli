name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify tag and versions
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "v${version}" = "${GITHUB_REF_NAME}"
          node scripts/sync-version.mjs --check
          node scripts/validate-packages.mjs
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --locked
      - run: npm test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build native binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo install cross --version 0.2.5 --locked
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Stage build artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/rstats.exe" "dist/rstats-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/rstats" "dist/rstats-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rstats-${{ matrix.target }}
          path: dist/*

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: rstats-*
          path: dist
          merge-multiple: true
      - name: Stage npm platform packages
        shell: bash
        run: |
          node scripts/stage-native-package.mjs x86_64-apple-darwin dist/rstats-x86_64-apple-darwin
          node scripts/stage-native-package.mjs aarch64-apple-darwin dist/rstats-aarch64-apple-darwin
          node scripts/stage-native-package.mjs x86_64-unknown-linux-gnu dist/rstats-x86_64-unknown-linux-gnu
          node scripts/stage-native-package.mjs aarch64-unknown-linux-gnu dist/rstats-aarch64-unknown-linux-gnu
          node scripts/stage-native-package.mjs x86_64-pc-windows-msvc dist/rstats-x86_64-pc-windows-msvc.exe
          node scripts/validate-packages.mjs --require-binaries
          for directory in npm/rstats-cli npm/rstats-cli-darwin-x64 npm/rstats-cli-darwin-arm64 npm/rstats-cli-linux-x64 npm/rstats-cli-linux-arm64 npm/rstats-cli-win32-x64; do
            (cd "${directory}" && npm pack --dry-run --json)
          done
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-staged
          path: npm
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-staged
          path: .
      - name: Publish platform packages
        run: |
          npm publish ./npm/rstats-cli-darwin-x64 --access public --provenance
          npm publish ./npm/rstats-cli-darwin-arm64 --access public --provenance
          npm publish ./npm/rstats-cli-linux-x64 --access public --provenance
          npm publish ./npm/rstats-cli-linux-arm64 --access public --provenance
          npm publish ./npm/rstats-cli-win32-x64 --access public --provenance
      - name: Publish main package
        run: npm publish ./npm/rstats-cli --access public --provenance

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
