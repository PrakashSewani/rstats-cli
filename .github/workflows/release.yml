name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and stage every artifact, skip npm publish and the GitHub release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify tag and versions
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "v${version}" = "${GITHUB_REF_NAME}"
          fi
          node scripts/sync-version.mjs --check
          node scripts/validate-packages.mjs
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --locked
      - run: npm test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build native binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo install cross --version 0.2.5 --locked
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Stage build artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/rstats.exe" "dist/rstats-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/rstats" "dist/rstats-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rstats-${{ matrix.target }}
          path: dist/*

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: rstats-*
          path: dist
          merge-multiple: true
      - name: Stage bundled native binaries
        shell: bash
        run: |
          node scripts/stage-native-package.mjs x86_64-apple-darwin dist/rstats-x86_64-apple-darwin
          node scripts/stage-native-package.mjs aarch64-apple-darwin dist/rstats-aarch64-apple-darwin
          node scripts/stage-native-package.mjs x86_64-unknown-linux-gnu dist/rstats-x86_64-unknown-linux-gnu
          node scripts/stage-native-package.mjs aarch64-unknown-linux-gnu dist/rstats-aarch64-unknown-linux-gnu
          node scripts/stage-native-package.mjs x86_64-pc-windows-msvc dist/rstats-x86_64-pc-windows-msvc.exe
          node scripts/validate-packages.mjs --require-binaries
          npm pack ./npm/rstats-cli --pack-destination dist
          sha256sum dist/* > dist/SHA256SUMS
      - name: Smoke-test the staged Linux binary
        shell: bash
        run: |
          ./npm/rstats-cli/bin/rstats-linux-x64 --version
          ./npm/rstats-cli/bin/rstats-linux-x64 --once
          ./npm/rstats-cli/bin/rstats-linux-x64 --once --json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const snapshot = JSON.parse(input);
              if (!snapshot.cpu || !snapshot.memory) throw new Error("snapshot is missing cpu or memory");
              console.log("snapshot ok");
            });
          '
      - name: Install the packed tarball into a clean project
        shell: bash
        run: |
          project=$(mktemp -d)
          cd "${project}"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "${GITHUB_WORKSPACE}"/dist/rstats-cli-*.tgz >/dev/null
          ./node_modules/.bin/rstats --version
          ./node_modules/.bin/rstats --once
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist

  publish:
    needs: package
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Bootstrap auth until npm trusted publishing is configured for rstats-cli.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify npm credentials
        shell: bash
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN repository secret is missing. Add an npm automation token before tagging a release."
            exit 1
          fi
          npm whoami
      - name: Publish package
        shell: bash
        run: |
          version=$(node -p "require('./npm/rstats-cli/package.json').version")
          if npm view "rstats-cli@${version}" version >/dev/null 2>&1; then
            echo "rstats-cli@${version} is already published; skipping"
          else
            npm publish ./dist/rstats-cli-*.tgz --access public --provenance
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
